<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Mara · Preview 800 × 480</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070b;
        --panel: #0c1018;
        --line: #1c2534;
        --ink: #e7edf5;
        --dim: #97a3b5;
        --faint: #57637a;
        --accent: #7cc7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 24px;
        background:
          radial-gradient(ellipse 90% 60% at 50% 0%, rgba(58, 96, 140, 0.14), transparent 72%),
          var(--bg);
        color: var(--ink);
        font-family: 'Inter Variable', ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      header {
        text-align: center;
      }

      h1 {
        margin: 0 0 7px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }

      header p {
        margin: 0;
        color: var(--dim);
        font-size: 12px;
      }

      .devices {
        --scale: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 32px;
      }

      .device {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .label a {
        color: var(--faint);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .label a:hover {
        color: var(--accent);
      }

      .frame {
        width: calc(800px * var(--scale));
        height: calc(480px * var(--scale));
      }

      .screen {
        width: 800px;
        height: 480px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #000;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(124, 199, 255, 0.04);
        transform: scale(var(--scale));
        transform-origin: top left;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }

      @media (max-width: 850px) {
        .devices {
          --scale: 0.8;
        }
      }

      @media (max-width: 700px) {
        .devices {
          --scale: 0.65;
        }
      }

      @media (max-width: 560px) {
        .devices {
          --scale: 0.5;
        }
      }

      @media (max-width: 430px) {
        .devices {
          --scale: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mara · 800 × 480</h1>
      <p>Vista horizontal a tamaño real · si la ventana es más pequeña se escala</p>
    </header>

    <div class="devices">
      <div class="device">
        <div class="label">
          <span>800 × 480 · Landscape · 1:1</span>
          <a href="/" target="_blank" rel="noreferrer">Abrir app</a>
        </div>
        <div class="frame">
          <div class="screen">
            <iframe src="/" title="Mara en 800 × 480" allow="microphone; camera; autoplay"></iframe>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
